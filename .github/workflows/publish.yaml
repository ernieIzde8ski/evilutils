# Big shoutout: https://github.com/astral-sh/trusted-publishing-examples/blob/main/.github/workflows/release.yml
name: Publish release to PyPI
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+rc[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+[ab][0-9]+"
jobs:
  build:
    name: "Build"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - &step_install-uv
        name: Install `uv`
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Build distributions
        run: uv build
      - name: Upload artifacts to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  release:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      id-token: write
    steps:
      - *step_install-uv
      - name: Download distributions artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        run: uv publish
